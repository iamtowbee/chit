[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chit"
version = "0.1.0"
description = "JIT compiler built with Rust and C++"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
chit = "chit.cli:main"

[tool.setuptools.packages.find]
include = ["chit*"]
