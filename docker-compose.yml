services:
  continue:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - STALL_TIMEOUT_MS=60000
      - API_KEYS=${API_KEYS:-}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  downloadbox:
    build: .
    command: ["node", "dist/downloadbox.js"]
    depends_on:
      - continue
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CONTINUE_BASE_URL=http://continue:3001
      - DOWNLOAD_DIR=/app/downloads
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
