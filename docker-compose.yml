services:
  platform:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - STALL_TIMEOUT_MS=60000
      - API_KEYS=${API_KEYS:-}
      - DATA_DIR=/app/data
      - DOWNLOAD_DIR=/app/downloads
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    restart: unless-stopped
